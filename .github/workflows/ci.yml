name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Actions are pinned by commit SHA.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Warm up dev shell
        run: nix develop -c true
      - name: Format
        run: nix develop -c cargo fmt --check
      - name: Clippy
        run: nix develop -c cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: nix develop -c cargo test --locked
      - name: cargo deny
        run: nix develop -c cargo deny --locked check
      - name: cargo audit
        run: nix develop -c cargo audit

  # Unsafe code in pinr and its dependencies, as a report in the job summary.
  geiger:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: cargo geiger
        run: |
          nix develop -c scripts/geiger.sh --output-format GitHubMarkdown >geiger.md
          { echo '```'; cat geiger.md; echo '```'; } >>"$GITHUB_STEP_SUMMARY"

  # The static Linux release asset is built twice, from two copies of the
  # source in different directories, and must be bit for bit identical (the
  # release workflow does the same for every target).
  reproducible:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
      - name: Build twice and compare
        run: nix develop .#release -c scripts/release.sh reproduce x86_64-unknown-linux-musl dist
